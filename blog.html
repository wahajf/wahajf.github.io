<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Wahaj Farooq</title>

  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('theme');
        var theme = savedTheme ? savedTheme : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);

        var savedAccent = localStorage.getItem('accent');
        var accents = ['orange', 'lime', 'skyblue'];
        var accent = savedAccent && accents.includes(savedAccent) ? savedAccent : accents[Math.floor(Math.random() * accents.length)];
        document.documentElement.setAttribute('data-accent', accent);
        localStorage.setItem('accent', accent);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.setAttribute('data-accent', 'orange');
      }
    })();
  </script>
  
  <style>
    :root {
      /* Top Area Background: Clean White */
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --subtle: #999999;
      --border: #e6e6e8;

      /* Full-width Section Below Hero in Light Mode: #FAFAFA */
      --sub-bg: #fafafa;
      --card-bg: #ffffff;
      --card-border: #eaeaea;
      --pill-bg: #eeeeef;
      
      /* Restored Navbar Tokens (Light Mode) */
      --nav-bg: #fafafa;
      --nav-border: 0.5px solid #eeeeee;
      --nav-text: #666666;
      --nav-icon-color: #222222;

      /* 50% Opacity White Blurred Overlay for Mobile Menu */
      --menu-bg: rgba(255, 255, 255, 0.5);

      --font-apple: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    [data-theme="dark"] {
      /* Deeper Very Dark Grey Background (#09090b) */
      --bg: #09090b;
      /* Slightly Lighter Grey Fill Below Hero (#121215) */
      --sub-bg: #121215;
      --text: #f0f0f2;
      --muted: #8e8e96;
      --subtle: #55555e;
      --border: #1c1c22;
      --card-bg: #18181c;
      --card-border: #24242a;
      --pill-bg: #222228;
      
      /* Restored Navbar Tokens (Dark Mode) */
      --nav-bg: #121215;
      --nav-border: 0.5px solid rgba(255, 255, 255, 0.12);
      --nav-text: #8e8e96;
      --nav-icon-color: #fafafa;

      /* 50% Opacity Dark Blurred Overlay for Mobile Menu */
      --menu-bg: rgba(9, 9, 11, 0.5);
    }

    /* LIGHT MODE ACCENT COLORS */
    html[data-accent="orange"],
    [data-accent="orange"] {
      --pill-active-bg: #fff0e6;
      --pill-active-text: #d93800;
      --trail-rgb: 255, 102, 0;
    }

    html[data-accent="lime"],
    [data-accent="lime"] {
      --pill-active-bg: #f0fdf4;
      --pill-active-text: #15803d;
      --trail-rgb: 34, 197, 94;
    }

    html[data-accent="skyblue"],
    [data-accent="skyblue"] {
      --pill-active-bg: #f0f9ff;
      --pill-active-text: #0284c7;
      --trail-rgb: 14, 165, 233;
    }

    /* DARK MODE ACCENT COLORS */
    html[data-theme="dark"][data-accent="orange"],
    html[data-theme="dark"] [data-accent="orange"] {
      --pill-active-bg: rgba(255, 120, 0, 0.18);
      --pill-active-text: #ff6b35;
      --trail-rgb: 255, 102, 0;
    }

    html[data-theme="dark"][data-accent="lime"],
    html[data-theme="dark"] [data-accent="lime"] {
      --pill-active-bg: rgba(34, 197, 94, 0.18);
      --pill-active-text: #4ade80;
      --trail-rgb: 34, 197, 94;
    }

    html[data-theme="dark"][data-accent="skyblue"],
    html[data-theme="dark"] [data-accent="skyblue"] {
      --pill-active-bg: rgba(14, 165, 233, 0.18);
      --pill-active-text: #38bdf8;
      --trail-rgb: 14, 165, 233;
    }

    *, html, body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-apple) !important;
      font-weight: 500 !important;
      box-shadow: none !important;
      cursor: crosshair;
    }

    /* Clickable elements get the pointer / clicking cursor */
    a, button, input, select, textarea, [role="button"], .nav-link, .circle-btn, .social-icon-btn, .website-pill, .category-tab, .post-card {
      cursor: pointer !important;
    }

    html { scroll-behavior: smooth; overflow-x: hidden; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-apple) !important;
      font-weight: 500 !important;
      font-size: 0.95rem;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding: 100px 0 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .inner-content-container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 0 24px;
      box-sizing: border-box;
    }

    /* DESKTOP NAV (> 768px) */
    .pill-navbar-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 48px);
      max-width: 620px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    /* MOBILE HEADER (≤ 768px) */
    .mobile-header-container {
      display: none;
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 1000;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    /* FULLSCREEN MOBILE OVERLAY MENU */
    .mobile-menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--menu-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 2000;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0, 0, 0.2, 1);
      pointer-events: none;
    }

    .mobile-menu-overlay.open {
      transform: translateX(0);
      pointer-events: auto;
    }

    @media (max-width: 768px) {
      body {
        padding-top: 80px !important;
      }
      .pill-navbar-container {
        display: none !important;
      }
      .mobile-header-container {
        display: flex !important;
      }
      .inner-content-container {
        padding: 0 16px !important;
      }
    }

    .nav-left-group {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .nav-right-group {
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }

    .pill-navbar {
      background-color: var(--nav-bg);
      border: var(--nav-border);
      border-radius: 9999px;
      padding: 3px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .circle-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--nav-bg);
      border: var(--nav-border);
      color: var(--nav-icon-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      outline: none;
    }

    html[data-theme="light"] .circle-btn {
      background-color: transparent !important;
    }

    .social-icon-btn {
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: transparent;
      border: none;
      padding: 4px;
      opacity: 0.75;
      transition: opacity 0.15s ease, color 0.15s ease;
    }

    .social-icon-btn.rightmost {
      padding: 4px 0 4px 4px;
    }

    .social-icon-btn:hover {
      opacity: 1;
      color: var(--text);
    }

    .nav-link {
      color: var(--nav-text);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      padding: 4px 12px;
      border-radius: 9999px;
      transition: all 0.18s ease;
      cursor: pointer;
      line-height: 1.2;
    }

    .nav-link:hover {
      color: var(--text);
    }

    .nav-link.active {
      background-color: var(--pill-active-bg);
      color: var(--pill-active-text);
      font-weight: 500;
    }

    .section-block {
      scroll-margin-top: 100px;
      margin-bottom: 48px;
    }

    .hero-section {
      scroll-margin-top: 100px;
      margin-bottom: 96px;
      padding-top: 48px;
    }

    .hero-text {
      font-size: 1.05rem;
      line-height: 1.4;
      font-weight: 500;
      color: var(--text);
    }

    .hero-text p {
      margin-bottom: 7px;
      font-weight: 500;
    }

    .hero-text p:last-child {
      margin-bottom: 0;
    }

    .section-label {
      font-size: 0.82rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .section-label.with-border {
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      transition: border-color 0.2s ease;
    }

    .card:hover, .post-card:hover {
      border-color: var(--pill-active-text);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 500;
      color: var(--text);
    }

    .card-date {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-top: 2px;
    }

    .website-pill {
      font-size: 0.78rem;
      padding: 4px 12px;
      border-radius: 9999px;
      background: var(--pill-bg);
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      transition: all 0.18s ease;
    }

    .website-pill.active {
      background-color: var(--pill-active-bg);
      color: var(--pill-active-text);
    }

    footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--muted);
    }

    .full-width-below-hero {
      width: 100vw;
      background-color: var(--sub-bg);
      border-top: none;
      padding-top: 16px;
      padding-bottom: 80px;
      display: flex;
      justify-content: center;
      transition: background-color 0.25s ease;
    }

    /* Fixed Progressive Blur Overlay at Top of Screen */
    .progressive-blur-top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 110px;
      pointer-events: none;
      z-index: 900;
      background: linear-gradient(
        to bottom,
        var(--bg) 0%,
        var(--bg) 60px,
        rgba(9, 9, 11, 0) 100%
      );
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 50px, rgba(0,0,0,0) 110px);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,1) 50px, rgba(0,0,0,0) 110px);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    }

    .pill-navbar-container,
    .mobile-header {
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease !important;
    }

    .nav-hidden.progressive-blur-top {
      transform: translateY(-100%) !important;
      opacity: 0 !important;
    }

    .nav-hidden.pill-navbar-container,
    .nav-hidden.mobile-header {
      transform: translateY(-120%) !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Fullscreen Modal Article Reader */
    .reader-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--bg);
      z-index: 999999;
      overflow-y: auto;
      padding: 80px 24px 60px;
      display: none;
      box-sizing: border-box;
    }

    .reader-modal.active {
      display: block;
    }
  </style>
</head>

  <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
    <main class="inner-content-container">
      <!-- Hero / About Section -->
      <section class="hero-section" id="about">
        <div class="hero-text">
          <p>
            Hi, I'm Wahaj, a Software Engineer and incoming CS freshman at <a href="https://www.sfu.ca" target="_blank" style="color: var(--text); text-decoration: underline; text-underline-offset: 4px; font-weight: 500;">Simon Fraser University</a>.
          </p>
          <p>On the side I run <a href="https://youtube.com/@thatyvrspotter" target="_blank" style="color: var(--text); text-decoration: underline; text-underline-offset: 4px; font-weight: 500;">@thatyvrspotter</a>, documenting planespotting at YVR.</p>
        </div>
      </section>
    </main>

    <!-- Full-Width Background Section Below Hero -->
    <div class="full-width-below-hero">
      <div class="inner-content-container">
        <!-- Work Section -->
        <section class="section-block" id="work">
          <div class="section-label">Work</div>

          <!-- Category Filter Pills -->
          <div id="categoryTabs" style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px;">
            <button class="website-pill active" style="cursor: pointer; border: none; outline: none;" onclick="filterCategory('All', this)">All</button>
            <button class="website-pill" style="cursor: pointer; border: none; outline: none;" onclick="filterCategory('Aviation', this)">Aviation</button>
            <button class="website-pill" style="cursor: pointer; border: none; outline: none;" onclick="filterCategory('Content Creation', this)">Content Creation</button>
            <button class="website-pill" style="cursor: pointer; border: none; outline: none;" onclick="filterCategory('Design', this)">Design</button>
            <button class="website-pill" style="cursor: pointer; border: none; outline: none;" onclick="filterCategory('Tech', this)">Tech</button>
          </div>

          <!-- Posts List -->
          <div id="postsList" style="display: flex; flex-direction: column; gap: 16px;">
            <div style="color: var(--muted); font-size: 0.9rem;">Loading articles...</div>
          </div>
        </section>

        <!-- Footer -->
        <footer>
          <span style="display: inline-flex; align-items: center; gap: 5px;">
            Vancouver, BC <span id="vancouverTime"></span> <span id="vancouverTemp"></span>
          </span>
          <div style="display: flex; align-items: center; gap: 6px;">
            <span>2026</span>
            <button id="footerAccentBtn" aria-label="Cycle Accent Color" style="background: transparent; border: none; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 2px; opacity: 0.75;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.92 0 1.7-.75 1.7-1.67 0-.41-.16-.79-.44-1.07-.27-.27-.44-.66-.44-1.07 0-.92.75-1.67 1.67-1.67H17c2.76 0 5-2.24 5-5 0-4.42-4.03-8-10-8z"/></svg>
            </button>
          </div>
        </footer>
      </div>
    </div>
  </div>

  <!-- Fullscreen Article Reader Overlay -->
  <div id="readerModal" class="reader-modal">
    <div class="inner-content-container" style="max-width: 620px;">
      <button onclick="closeReader()" style="background: none; border: none; color: var(--muted); font-size: 0.9rem; font-weight: 500; margin-bottom: 24px; cursor: pointer; padding: 0;">
        ← Back to Blog
      </button>

      <div id="modalCategories" style="display: flex; gap: 6px; margin-bottom: 12px;"></div>
      <h1 id="modalTitle" style="font-size: 1.8rem; font-weight: 600; color: var(--text); margin-bottom: 12px; line-height: 1.3;"></h1>
      <div id="modalMeta" style="font-size: 0.84rem; color: var(--subtle); margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border);"></div>
      
      <div id="modalBody" style="font-size: 0.98rem; color: var(--text); line-height: 1.8;"></div>
    </div>
  </div>

  <script>
    const SANITY_PROJECT_ID = 'y5ygdyls';
    const SANITY_DATASET = 'production';
    const QUERY = encodeURIComponent('*[_type == "post"] | order(publishedAt desc) { _id, title, slug, publishedAt, readTime, excerpt, body, categories[]->{ _id, title, slug } }');
    const SANITY_URL = `https://${SANITY_PROJECT_ID}.apicdn.sanity.io/v2024-02-01/data/query/${SANITY_DATASET}?query=${QUERY}`;

    let allPosts = [
      {
        _id: 'mock-1',
        title: 'flight citizen - the man behind the wing',
        slug: { current: 'building-flight-citizen' },
        publishedAt: '2026-08-10T12:00:00Z',
        readTime: '3 min read',
        excerpt: 'Insights on designing a minimal, fast aviation tracking platform and digital media publication.',
        categories: [{ title: 'Aviation' }, { title: 'Design' }],
        bodyText: `Flight Citizen started as a passion project to combine real-time aviation telemetry with clean, distraction-free user interfaces.\n\nKey design pillars:\n- Minimalist layout focused on high-contrast aircraft telemetry data.\n- Instant search with zero latency.\n- Integrated photo streams from community spotters.`
      },
      {
        _id: 'mock-2',
        title: 'growing @thatyvrspotter to 150K+ views',
        slug: { current: 'growing-thatyvrspotter' },
        publishedAt: '2026-08-10T12:00:00Z',
        readTime: '3 min read',
        excerpt: 'How I record, edit, and optimize short-form aviation videos at Vancouver International Airport (YVR).',
        categories: [{ title: 'Content Creation' }, { title: 'Aviation' }],
        bodyText: `Documenting aircraft operations at YVR requires consistency and clear audio-visual pacing.\n\nTakeaways from 150K+ views:\n- Audio timing is critical: Jet engine spool-up sounds hook viewers in the first 2 seconds.\n- Highlighting unique liveries (ANA Eevee Jet, Air Canada retro) drives higher engagement.\n- Direct community interaction builds long-term subscriber loyalty.`
      },
      {
        _id: 'mock-3',
        title: 'modern web architecture: next.js & sanity cms',
        slug: { current: 'modern-web-architecture-nextjs' },
        publishedAt: '2026-08-10T12:00:00Z',
        readTime: '3 min read',
        excerpt: 'Setting up dynamic content pipelines with structured schemas and real-time CMS previews.',
        categories: [{ title: 'Tech' }, { title: 'Design' }],
        bodyText: `Combining Next.js with a headless CMS like Sanity gives full content editing flexibility without sacrificing page performance.\n\nWhy headless CMS?\n- Content creators can edit and publish posts visually in Sanity Studio.\n- Structured JSON schemas ensure clean API contracts.\n- Incremental static regeneration keeps response times under 50ms.`
      }
    ];

    async function fetchPostsFromSanity() {
      try {
        const res = await fetch(SANITY_URL);
        const data = await res.json();
        if (data.result && data.result.length > 0) {
          allPosts = data.result;
        }
      } catch (err) {
        console.log('Sanity API offline or fallback used:', err);
      }
      renderPosts(allPosts);
    }

    function renderPosts(posts) {
      const container = document.getElementById('postsList');
      if (!posts || posts.length === 0) {
        container.innerHTML = `<div style="color: var(--muted); font-size: 0.9rem;">No articles found.</div>`;
        return;
      }

      container.innerHTML = posts.map(post => {
        const categoriesHtml = (post.categories || []).map(cat => 
          `<span class="website-pill">${cat.title}</span>`
        ).join(' ');

        const dateStr = post.publishedAt ? new Date(post.publishedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
        const readTime = post.readTime || '3 min read';
        const slug = post.slug ? post.slug.current : post._id;

        return `
          <div class="card" onclick="openReader('${slug}')" style="cursor: pointer;">
            <div class="card-top">
              <div>
                <div class="card-title">${post.title}</div>
                <div class="card-date">${dateStr} • ${readTime}</div>
              </div>
              <div style="display: flex; gap: 6px;">
                ${categoriesHtml}
              </div>
            </div>
            <p style="font-size: 0.88rem; color: var(--muted); line-height: 1.5; margin-bottom: 14px;">${post.excerpt || ''}</p>
            <div style="display: flex; justify-content: flex-end;">
              <span class="website-pill active">Read article ↗</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function openReader(slug) {
      const post = allPosts.find(p => (p.slug && p.slug.current === slug) || p._id === slug);
      if (!post) return;

      document.getElementById('modalTitle').innerText = post.title;
      document.getElementById('modalMeta').innerText = `${post.publishedAt ? new Date(post.publishedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : ''} • ${post.readTime || '3 min read'}`;
      
      const categoriesHtml = (post.categories || []).map(cat => 
        `<span class="website-pill">${cat.title}</span>`
      ).join(' ');
      document.getElementById('modalCategories').innerHTML = categoriesHtml;

      if (post.bodyText) {
        document.getElementById('modalBody').innerText = post.bodyText;
      } else if (post.body && Array.isArray(post.body)) {
        const paragraphs = post.body
          .filter(block => block._type === 'block')
          .map(block => (block.children || []).map(c => c.text).join(''))
          .join('\n\n');
        document.getElementById('modalBody').innerText = paragraphs || post.excerpt || '';
      } else {
        document.getElementById('modalBody').innerText = post.excerpt || '';
      }

      document.getElementById('readerModal').classList.add('active');
      window.location.hash = slug;
    }

    function closeReader() {
      document.getElementById('readerModal').classList.remove('active');
      window.location.hash = '';
    }

    function filterCategory(cat, el) {
      document.querySelectorAll('#categoryTabs .website-pill').forEach(tab => tab.classList.remove('active'));
      if (el) el.classList.add('active');

      if (cat === 'All') {
        renderPosts(allPosts);
      } else {
        const filtered = allPosts.filter(p => (p.categories || []).some(c => c.title.toLowerCase() === cat.toLowerCase()));
        renderPosts(filtered);
      }
    }

    // Check hash on load
    window.addEventListener('load', () => {
      fetchPostsFromSanity().then(() => {
        if (window.location.hash) {
          const hashSlug = window.location.hash.replace('#', '');
          openReader(hashSlug);
        }
      });
    });

    // Theme setup
    const htmlEl = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const mobileThemeBtn = document.getElementById('mobileThemeBtn');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    function setTheme(t) {
      htmlEl.setAttribute('data-theme', t);
      localStorage.setItem('theme', t);
      if (t === 'light') {
        if (sunIcon) sunIcon.style.display = 'none';
        if (moonIcon) moonIcon.style.display = 'block';
      } else {
        if (sunIcon) sunIcon.style.display = 'block';
        if (moonIcon) moonIcon.style.display = 'none';
      }
    }

    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const currentTheme = htmlEl.getAttribute('data-theme');
        setTheme(currentTheme === 'light' ? 'dark' : 'light');
      });
    }

    if (mobileThemeBtn) {
      mobileThemeBtn.addEventListener('click', () => {
        const currentTheme = htmlEl.getAttribute('data-theme');
        setTheme(currentTheme === 'light' ? 'dark' : 'light');
      });
    }

    // Mobile Menu Controls
    const mobileOverlay = document.getElementById('mobileOverlay');
    const mobileMenuOpenBtn = document.getElementById('mobileMenuOpenBtn');
    const mobileMenuCloseBtn = document.getElementById('mobileMenuCloseBtn');

    if (mobileMenuOpenBtn) {
      mobileMenuOpenBtn.addEventListener('click', () => {
        if (mobileOverlay) mobileOverlay.classList.add('open');
      });
    }

    if (mobileMenuCloseBtn) {
      mobileMenuCloseBtn.addEventListener('click', () => {
        if (mobileOverlay) mobileOverlay.classList.remove('open');
      });
    }

    function closeMobileMenu() {
      if (mobileOverlay) mobileOverlay.classList.remove('open');
    }

    // Live Vancouver Clock, Weather & Accent Switcher
    function updateClock() {
      const vancouverTime = new Date().toLocaleTimeString('en-US', {
        timeZone: 'America/Vancouver',
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      });
      const clockEl = document.getElementById('vancouverTime');
      if (clockEl) clockEl.innerText = `• ${vancouverTime}`;
    }
    updateClock();
    setInterval(updateClock, 10000);

    fetch('https://api.open-meteo.com/v1/forecast?latitude=49.2827&longitude=-123.1207&current_weather=true')
      .then(res => res.json())
      .then(data => {
        if (data?.current_weather?.temperature !== undefined) {
          const tempEl = document.getElementById('vancouverTemp');
          if (tempEl) tempEl.innerText = `• ${Math.round(data.current_weather.temperature)}°C ⛅`;
        }
      }).catch(() => {});

    const footerAccentBtn = document.getElementById('footerAccentBtn');
    if (footerAccentBtn) {
      footerAccentBtn.addEventListener('click', () => {
        const current = htmlEl.getAttribute('data-accent') || 'orange';
        const accents = ['orange', 'lime', 'skyblue'];
        const nextAccent = accents[(accents.indexOf(current) + 1) % accents.length];
        htmlEl.setAttribute('data-accent', nextAccent);
        localStorage.setItem('accent', nextAccent);
      });
    }

    // Dynamic Cursor Trail Animation Script
    const canvas = document.getElementById('cursorCanvas');
    if (canvas) {
      const ctx = canvas.getContext('2d');
      let points = [];
      const TRAIL_LIFETIME = 350;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      window.addEventListener('mousemove', (e) => {
        points.unshift({ x: e.clientX, y: e.clientY, time: Date.now() });
      });

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const now = Date.now();
        const trailRgb = getComputedStyle(document.documentElement).getPropertyValue('--trail-rgb').trim() || '255, 102, 0';

        points = points.filter(p => now - p.time < TRAIL_LIFETIME);

        if (points.length > 1) {
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          for (let i = 0; i < points.length - 1; i++) {
            const p1 = points[i];
            const p2 = points[i + 1];

            const age = now - p1.time;
            const ratio = Math.max(0, 1 - age / TRAIL_LIFETIME);
            if (ratio <= 0) continue;

            const alpha = 0.65 * Math.pow(ratio, 1.8);
            const strokeWidth = Math.max(0.5, 6.5 * ratio);

            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.strokeStyle = `rgba(${trailRgb}, ${alpha})`;
            ctx.lineWidth = strokeWidth;
            ctx.shadowColor = `rgba(${trailRgb}, ${alpha * 0.6})`;
            ctx.shadowBlur = 6;
            ctx.stroke();
          }
        }

        requestAnimationFrame(render);
      }
      render();
    }

    // Scroll hide
    (function() {
      let lastY = 0;
      window.addEventListener('scroll', function() {
        const currY = window.scrollY;
        const blurTop = document.querySelector('.progressive-blur-top');
        const navDesk = document.querySelector('.pill-navbar-container');
        const navMob = document.querySelector('.mobile-header-container');

        if (currY <= 30) {
          blurTop && blurTop.classList.remove('nav-hidden');
          navDesk && navDesk.classList.remove('nav-hidden');
          navMob && navMob.classList.remove('nav-hidden');
        } else if (currY > lastY && currY > 50) {
          blurTop && blurTop.classList.add('nav-hidden');
          navDesk && navDesk.classList.add('nav-hidden');
          navMob && navMob.classList.add('nav-hidden');
        } else if (currY < lastY) {
          blurTop && blurTop.classList.remove('nav-hidden');
          navDesk && navDesk.classList.remove('nav-hidden');
          navMob && navMob.classList.remove('nav-hidden');
        }

        lastY = currY;
      });
    })();
  </script>
</body>
</html>
